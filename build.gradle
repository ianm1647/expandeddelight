plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://maven.parchmentmc.org" }
	maven { url = "https://maven.fabricmc.net/" }
	maven { url = 'https://jitpack.io' }
	maven { url = "https://maven.blamejared.com/" }
	maven { url = 'https://maven.greenhouse.lgbt/releases/' }
}

fabricApi {
	configureDataGeneration {
		client = true
	}
}

loom {
	accessWidenerPath = file("src/main/resources/expandeddelight.accesswidener")
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		it.officialMojangMappings {
			setNameSyntheticMembers(false)
		}
		it.parchment("org.parchmentmc.data:parchment-${project.parchment_version}")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	include(modImplementation("com.github.Chocohead:Fabric-ASM:${fabric_asm_version}")) {
		exclude (group: "net.fabricmc.fabric-api")
	}

	modImplementation("vectorwing:FarmersDelight:${delight_version}") {
		exclude(group: "net.fabricmc")
	}

	modCompileOnly("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
	modCompileOnly("mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}")
	modLocalRuntime("mezz.jei:jei-${minecraft_version}-fabric:${jei_version}")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": inputs.properties.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}

jar {
	inputs.property "archivesName", project.base.archivesName

	from("LICENSE") {
		rename { "${it}_${inputs.properties.archivesName}"}
	}
}

// configure the maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			artifactId = project.archives_base_name
			from components.java
		}
	}

	// See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
	repositories {
		// Add repositories to publish to here.
		// Notice: This block does NOT have the same function as the block in the top level.
		// The repositories here will be used for publishing your artifact, not for
		// retrieving dependencies.
	}
}