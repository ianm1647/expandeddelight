plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.144'
    id 'idea'
}

tasks.named('wrapper', Wrapper).configure {
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

sourceSets.main.resources {
    srcDir('src/generated/resources')
    exclude("**/*.bbmodel")
    exclude("src/generated/**/.cache")
}

repositories {
    mavenLocal()
    maven {
        url = "https://maven.blamejared.com"
        content {
            includeGroup "mezz.jei"
        }
    }
    maven { url = "https://maven.ryanliptak.com/" }
    maven { url = "https://www.cursemaven.com" }
    maven {
        url = "https://maven.saps.dev/minecraft"
        content {
            includeGroup "dev.latvian.mods"
            includeGroup "dev.latvian.apps"
        }
    }
    maven {
        url = "https://maven.architectury.dev"
        content {
            includeGroup "dev.architectury"
        }
    }
}

dependencies {
    //compats

    implementation "curse.maven:trail-tales-delight-1198527:8584143"
    implementation "curse.maven:pineapple-delight-687974:8633977"
    implementation "curse.maven:cultural-delights-574622:8126191"
    implementation "curse.maven:crabbers-delight-892827:8006190"
    implementation "curse.maven:hearth-and-harvest-1212197:8590173"
    implementation "curse.maven:brewin-and-chewin-637808:8309583"
    implementation "curse.maven:farmers-respite-unofficial-port-1475195:8711341"
    implementation "curse.maven:collectors-reap-unofficial-port-1661146:8717972"
    implementation "curse.maven:my-nethers-delight-1003673:8535835"

    implementation "curse.maven:lodestone-616457:7264731"
    implementation "curse.maven:miners-delight-plus-689630:8011049"

    implementation "curse.maven:windsweptmod-636321:8726892"
    implementation "curse.maven:windswept-delights-1372501:8544123"

    implementation "curse.maven:runiclib-880879:8188562"
    implementation "curse.maven:dungeons-delight-1258923:8041434"

    implementation "curse.maven:blueprint-382216:8397829"
    implementation "curse.maven:gallery-1173553:8159692"
    implementation "curse.maven:neapolitan-382016:7119475"

    implementation "curse.maven:terrablender-neoforge-940057:6054947"
    implementation "curse.maven:natures-spirit-1044992:6962784"
    implementation "curse.maven:natures-delight-1082132:8344818"

    implementation "curse.maven:farmers-delight-398521:$delight_version"

    compileOnly "squeek.appleskin:appleskin-neoforge:$appleskin_version:api"
    runtimeOnly "squeek.appleskin:appleskin-neoforge:$appleskin_version"

    compileOnly "mezz.jei:jei-$minecraft_version-common-api:$jei_version"
    compileOnly "mezz.jei:jei-$minecraft_version-neoforge-api:$jei_version"

    runtimeOnly "mezz.jei:jei-$minecraft_version-neoforge:$jei_version"
}

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = project.neo_version
    parchment {
        mappingsVersion = project.parchment_mappings_version
        minecraftVersion = project.parchment_minecraft_version
    }

    accessTransformers = project.files('src/main/resources/META-INF/accesstransformer.cfg')

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        gameTestServer {
            type = "gameTestServer"
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }

        configureEach {
            systemProperty 'forge.logging.markers', 'REGISTRIES'
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }

    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

var generateModMetadata = tasks.register("generateModMetadata", ProcessResources) {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description,
    ]
    inputs.properties replaceProperties
    expand replaceProperties
    from "src/main/templates"
    into "build/generated/sources/modMetadata"
}

sourceSets.main.resources.srcDir generateModMetadata
neoForge.ideSyncTask generateModMetadata

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
